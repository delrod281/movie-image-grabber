<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Image Grabber</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      max-width: 1400px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
    }

    p {
      color: #aaa;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    input, select, textarea {
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
    }

    #movieTitle {
      flex: 1;
      min-width: 250px;
    }

    button {
      padding: 12px 18px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 20px 0;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      padding-bottom: 10px;
    }

    .image-wrap {
      position: relative;
    }

    .movie-image {
      width: 100%;
      display: block;
      cursor: pointer;
    }

    .check {
      position: absolute;
      top: 10px;
      left: 10px;
      transform: scale(1.5);
      cursor: pointer;
    }

    .meta {
      padding: 10px 12px 0;
      color: #aaa;
      font-size: 13px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      padding: 10px 12px 0;
    }

    .card-actions button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
    }

    #status {
      margin-top: 15px;
      color: #aaa;
    }

    .selected-count {
      color: #ddd;
    }

    .section {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #333;
    }

    .batch-help {
      color: #aaa;
      margin-bottom: 10px;
    }

    #batchList {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      background: #1a1a1a;
      color: white;
      border: 1px solid #333;
      font-family: Consolas, Monaco, monospace;
      line-height: 1.5;
    }

    #batchYear {
      width: 120px;
      background: white;
      color: #111;
    }

    #batchStatus {
      margin-top: 15px;
      color: #aaa;
    }

    #batchResults {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .batch-card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      padding-bottom: 12px;
    }

    .batch-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .batch-placeholder {
      width: 100%;
      aspect-ratio: 2 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
      color: #777;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .batch-info {
      padding: 12px;
    }

    .batch-rank {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .batch-requested {
      color: #ddd;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .batch-match-select {
      width: 100%;
      margin-top: 8px;
      background: white;
      color: #111;
    }

    .batch-match-meta {
      color: #aaa;
      font-size: 13px;
      margin-top: 8px;
    }

    .batch-error {
      color: #f5a3a3;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>

  <h1>🎬 Movie Image Grabber</h1>
  <p>Browse and grab high-resolution movie images from TMDb.</p>

  <div class="controls">
    <input
      type="password"
      id="token"
      placeholder="TMDb Read Access Token"
    >

    <button onclick="saveToken()">Save Token</button>
  </div>

  <div class="controls">
    <input
      type="text"
      id="movieTitle"
      placeholder="Enter a movie title..."
    >

    <select id="imageCount">
      <option value="20">20 images</option>
      <option value="30">30 images</option>
      <option value="50" selected>50 images</option>
    </select>

    <button onclick="findMovie()">Find Images</button>
  </div>

  <div class="toolbar">
    <button onclick="selectAll()">Select All</button>
    <button onclick="clearSelection()">Clear Selection</button>
    <button onclick="downloadSelectedZip()">Download Selected ZIP</button>
    <span class="selected-count" id="selectedCount">0 selected</span>
  </div>

  <div id="status"></div>
  <div id="results"></div>

  <div class="section">
    <h2>Batch Rankings — Posters</h2>
    <p class="batch-help">
      Paste one movie per line as <strong>rank|title</strong>. Example:
      <strong>48|Evil Dead Burn</strong>. The year helps TMDb choose the correct version.
    </p>

    <div class="controls">
      <input
        type="number"
        id="batchYear"
        value="2026"
        min="1870"
        max="2100"
        placeholder="Year"
      >

      <button onclick="findBatchPosters()">Find Posters</button>
      <button onclick="clearBatch()">Clear Batch</button>
      <button onclick="downloadBatchPostersZip()">Download Posters ZIP</button>
    </div>

    <textarea
      id="batchList"
      placeholder="48|Evil Dead Burn&#10;47|Animal Farm&#10;46|End of Oak Street&#10;...&#10;1|Camp Miasma"
    ></textarea>

    <div id="batchStatus"></div>
    <div id="batchResults"></div>
  </div>

<script>

const tokenBox = document.getElementById("token");
const movieBox = document.getElementById("movieTitle");
const statusBox = document.getElementById("status");
const resultsBox = document.getElementById("results");
const selectedCountBox = document.getElementById("selectedCount");

const batchListBox = document.getElementById("batchList");
const batchYearBox = document.getElementById("batchYear");
const batchStatusBox = document.getElementById("batchStatus");
const batchResultsBox = document.getElementById("batchResults");

let currentImages = [];
let currentMovieTitle = "Movie";
let currentMovieYear = "";

let batchItems = [];

const savedToken = localStorage.getItem("tmdbToken");

if (savedToken) {
  tokenBox.value = savedToken;
}

function saveToken() {
  const token = tokenBox.value.trim();

  if (!token) {
    alert("Paste your TMDb Read Access Token first.");
    return;
  }

  localStorage.setItem("tmdbToken", token);
  alert("Token saved on this browser.");
}

async function tmdbRequest(url) {
  const token = tokenBox.value.trim();

  if (!token) {
    throw new Error("Enter your TMDb Read Access Token first.");
  }

  const response = await fetch(url, {
    headers: {
      Authorization: `Bearer ${token}`,
      accept: "application/json"
    }
  });

  if (!response.ok) {
    throw new Error("TMDb request failed. Check your token.");
  }

  return response.json();
}

function safeName(name) {
  return name.replace(/[<>:"/\\|?*]/g, "").trim();
}

async function findMovie() {
  const title = movieBox.value.trim();
  const limit = Number(document.getElementById("imageCount").value);

  if (!title) {
    return;
  }

  resultsBox.innerHTML = "";
  currentImages = [];
  updateSelectedCount();

  statusBox.textContent = "Searching for " + title + "...";

  try {
    const searchData = await tmdbRequest(
      "https://api.themoviedb.org/3/search/movie?query="
      + encodeURIComponent(title)
    );

    if (!searchData.results.length) {
      statusBox.textContent = "Movie not found.";
      return;
    }

    const movie = searchData.results[0];

    currentMovieTitle = movie.title;
    currentMovieYear = movie.release_date
      ? movie.release_date.substring(0, 4)
      : "";

    statusBox.textContent =
      `Found ${movie.title} ${currentMovieYear ? "(" + currentMovieYear + ")" : ""}. Loading images...`;

    const imageData = await tmdbRequest(
      `https://api.themoviedb.org/3/movie/${movie.id}/images`
    );

    let images = imageData.backdrops || [];

    images.sort((a, b) => {
      if (b.vote_average !== a.vote_average) {
        return b.vote_average - a.vote_average;
      }

      return b.width - a.width;
    });

    images = images.slice(0, limit);

    currentImages = images;

    if (!images.length) {
      statusBox.textContent = "No backdrop images found.";
      return;
    }

    statusBox.textContent =
      `${movie.title}: showing ${images.length} images.`;

    images.forEach((image, index) => {

      const card = document.createElement("div");
      card.className = "card";

      const imageWrap = document.createElement("div");
      imageWrap.className = "image-wrap";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "check";
      checkbox.dataset.index = index;
      checkbox.addEventListener("change", updateSelectedCount);

      const img = document.createElement("img");
      img.src = "https://image.tmdb.org/t/p/w500" + image.file_path;
      img.className = "movie-image";
      img.title = `${image.width} × ${image.height}`;

      img.onclick = () => {
        checkbox.checked = !checkbox.checked;
        updateSelectedCount();
      };

      imageWrap.appendChild(img);
      imageWrap.appendChild(checkbox);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${image.width} × ${image.height}`;

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const openBtn = document.createElement("button");
      openBtn.textContent = "Full Res";
      openBtn.onclick = () => {
        window.open(
          "https://image.tmdb.org/t/p/original" + image.file_path,
          "_blank"
        );
      };

      const downloadBtn = document.createElement("button");
      downloadBtn.textContent = "Download";
      downloadBtn.onclick = () => {
        downloadImage(image.file_path, index + 1);
      };

      actions.appendChild(openBtn);
      actions.appendChild(downloadBtn);

      card.appendChild(imageWrap);
      card.appendChild(meta);
      card.appendChild(actions);

      resultsBox.appendChild(card);
    });

  } catch (error) {
    statusBox.textContent = error.message;
  }
}

function updateSelectedCount() {
  const checked = document.querySelectorAll(".check:checked");
  selectedCountBox.textContent = `${checked.length} selected`;
}

function selectAll() {
  document.querySelectorAll(".check").forEach(box => {
    box.checked = true;
  });

  updateSelectedCount();
}

function clearSelection() {
  document.querySelectorAll(".check").forEach(box => {
    box.checked = false;
  });

  updateSelectedCount();
}

async function downloadImage(filePath, number) {
  const url = "https://image.tmdb.org/t/p/original" + filePath;

  try {
    const response = await fetch(url);
    const blob = await response.blob();

    const blobUrl = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = blobUrl;

    const movieName = safeName(currentMovieTitle);
    link.download =
      `${movieName} ${String(number).padStart(2, "0")}.jpg`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(blobUrl);

  } catch (error) {
    window.open(url, "_blank");
  }
}

async function downloadSelectedZip() {

  const selectedBoxes = Array.from(
    document.querySelectorAll(".check:checked")
  );

  if (!selectedBoxes.length) {
    alert("Select at least one image first.");
    return;
  }

  const zip = new JSZip();

  const folderName = safeName(
    currentMovieYear
      ? `${currentMovieTitle} (${currentMovieYear})`
      : currentMovieTitle
  );

  const folder = zip.folder(folderName);

  statusBox.textContent =
    `Preparing ${selectedBoxes.length} full-resolution images...`;

  try {

    let count = 1;

    for (const box of selectedBoxes) {

      const index = Number(box.dataset.index);
      const image = currentImages[index];

      const url =
        "https://image.tmdb.org/t/p/original"
        + image.file_path;

      statusBox.textContent =
        `Downloading image ${count} of ${selectedBoxes.length}...`;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Could not download one of the images.");
      }

      const blob = await response.blob();

      const extension =
        image.file_path.split(".").pop() || "jpg";

      const filename =
        `${safeName(currentMovieTitle)} ${String(count).padStart(2, "0")}.${extension}`;

      folder.file(filename, blob);

      count++;
    }

    statusBox.textContent = "Creating ZIP file...";

    const zipBlob = await zip.generateAsync({
      type: "blob"
    });

    const zipUrl = URL.createObjectURL(zipBlob);

    const link = document.createElement("a");
    link.href = zipUrl;
    link.download = `${folderName}.zip`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(zipUrl);

    statusBox.textContent =
      `Done! Downloaded ${selectedBoxes.length} images as ${folderName}.zip`;

  } catch (error) {

    statusBox.textContent =
      "ZIP download failed: " + error.message;

  }
}

function parseBatchList() {
  const lines = batchListBox.value
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);

  const parsed = [];

  for (const line of lines) {
    const separatorIndex = line.indexOf("|");

    if (separatorIndex === -1) {
      parsed.push({
        rank: "",
        requestedTitle: line,
        error: "Use rank|title format."
      });
      continue;
    }

    const rank = line.slice(0, separatorIndex).trim();
    const requestedTitle = line.slice(separatorIndex + 1).trim();

    if (!rank || !requestedTitle) {
      parsed.push({
        rank,
        requestedTitle,
        error: "Use rank|title format."
      });
      continue;
    }

    parsed.push({
      rank,
      requestedTitle,
      error: ""
    });
  }

  return parsed;
}

async function searchMovieCandidates(title, year) {
  let url =
    "https://api.themoviedb.org/3/search/movie?query="
    + encodeURIComponent(title)
    + "&include_adult=false";

  if (year) {
    url += "&year=" + encodeURIComponent(year);
  }

  let data = await tmdbRequest(url);

  if ((!data.results || !data.results.length) && year) {
    data = await tmdbRequest(
      "https://api.themoviedb.org/3/search/movie?query="
      + encodeURIComponent(title)
      + "&include_adult=false"
    );
  }

  return (data.results || [])
    .filter(movie => movie.poster_path)
    .slice(0, 5);
}

function movieYear(movie) {
  return movie.release_date
    ? movie.release_date.substring(0, 4)
    : "Year unknown";
}

function renderBatchCard(item, index) {
  const card = document.createElement("div");
  card.className = "batch-card";
  card.dataset.index = index;

  let visual;

  if (item.selectedMovie && item.selectedMovie.poster_path) {
    visual = document.createElement("img");
    visual.className = "batch-poster";
    visual.src =
      "https://image.tmdb.org/t/p/w500"
      + item.selectedMovie.poster_path;
    visual.alt = item.selectedMovie.title + " poster";
  } else {
    visual = document.createElement("div");
    visual.className = "batch-placeholder";
    visual.textContent = item.error || "No poster found";
  }

  const info = document.createElement("div");
  info.className = "batch-info";

  const rank = document.createElement("div");
  rank.className = "batch-rank";
  rank.textContent = `#${item.rank || "?"}`;

  const requested = document.createElement("div");
  requested.className = "batch-requested";
  requested.textContent = item.requestedTitle || "(missing title)";

  info.appendChild(rank);
  info.appendChild(requested);

  if (item.candidates && item.candidates.length) {
    const select = document.createElement("select");
    select.className = "batch-match-select";

    item.candidates.forEach((movie, candidateIndex) => {
      const option = document.createElement("option");
      option.value = candidateIndex;
      option.textContent =
        `${movie.title} (${movieYear(movie)})`;
      select.appendChild(option);
    });

    select.value = item.selectedCandidateIndex || 0;

    select.addEventListener("change", () => {
      const chosenIndex = Number(select.value);
      item.selectedCandidateIndex = chosenIndex;
      item.selectedMovie = item.candidates[chosenIndex];
      renderAllBatchCards();
    });

    info.appendChild(select);

    const meta = document.createElement("div");
    meta.className = "batch-match-meta";
    meta.textContent =
      `TMDb match: ${item.selectedMovie.title} (${movieYear(item.selectedMovie)})`;

    info.appendChild(meta);
  }

  if (item.error) {
    const error = document.createElement("div");
    error.className = "batch-error";
    error.textContent = item.error;
    info.appendChild(error);
  }

  card.appendChild(visual);
  card.appendChild(info);

  return card;
}

function renderAllBatchCards() {
  batchResultsBox.innerHTML = "";

  batchItems.forEach((item, index) => {
    batchResultsBox.appendChild(
      renderBatchCard(item, index)
    );
  });
}

async function findBatchPosters() {
  const parsed = parseBatchList();

  if (!parsed.length) {
    alert("Paste at least one ranked movie first.");
    return;
  }

  const year = batchYearBox.value.trim();

  batchItems = parsed.map(item => ({
    ...item,
    candidates: [],
    selectedCandidateIndex: 0,
    selectedMovie: null
  }));

  batchResultsBox.innerHTML = "";

  let foundCount = 0;

  for (let i = 0; i < batchItems.length; i++) {
    const item = batchItems[i];

    batchStatusBox.textContent =
      `Searching ${i + 1} of ${batchItems.length}: ${item.requestedTitle || "invalid line"}...`;

    if (item.error) {
      continue;
    }

    try {
      const candidates = await searchMovieCandidates(
        item.requestedTitle,
        year
      );

      item.candidates = candidates;

      if (candidates.length) {
        item.selectedMovie = candidates[0];
        foundCount++;
      } else {
        item.error = "No poster match found.";
      }

    } catch (error) {
      item.error = error.message;
    }

    renderAllBatchCards();
  }

  batchStatusBox.textContent =
    `Finished. Found poster matches for ${foundCount} of ${batchItems.length} entries. Review the dropdowns before downloading.`;
}

function clearBatch() {
  batchListBox.value = "";
  batchItems = [];
  batchResultsBox.innerHTML = "";
  batchStatusBox.textContent = "";
}

async function downloadBatchPostersZip() {
  const downloadable = batchItems.filter(
    item => item.selectedMovie && item.selectedMovie.poster_path
  );

  if (!downloadable.length) {
    alert("Find and review batch posters first.");
    return;
  }

  const zip = new JSZip();
  const year = batchYearBox.value.trim();
  const folderName = safeName(
    year ? `${year} Movie Rankings` : "Movie Rankings"
  );
  const folder = zip.folder(folderName);

  try {
    for (let i = 0; i < downloadable.length; i++) {
      const item = downloadable[i];
      const movie = item.selectedMovie;
      const posterPath = movie.poster_path;

      batchStatusBox.textContent =
        `Downloading poster ${i + 1} of ${downloadable.length}: ${item.requestedTitle}...`;

      const response = await fetch(
        "https://image.tmdb.org/t/p/original" + posterPath
      );

      if (!response.ok) {
        throw new Error(
          `Could not download poster for ${item.requestedTitle}.`
        );
      }

      const blob = await response.blob();
      const extension =
        posterPath.split(".").pop() || "jpg";

      const rankNumber = String(item.rank).padStart(2, "0");
      const filename =
        `${rankNumber} - ${safeName(item.requestedTitle)}.${extension}`;

      folder.file(filename, blob);
    }

    batchStatusBox.textContent = "Creating poster ZIP...";

    const zipBlob = await zip.generateAsync({
      type: "blob"
    });

    const zipUrl = URL.createObjectURL(zipBlob);

    const link = document.createElement("a");
    link.href = zipUrl;
    link.download = `${folderName}.zip`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(zipUrl);

    batchStatusBox.textContent =
      `Done! Downloaded ${downloadable.length} posters as ${folderName}.zip`;

  } catch (error) {
    batchStatusBox.textContent =
      "Poster ZIP download failed: " + error.message;
  }
}

movieBox.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    findMovie();
  }
});

</script>

</body>
</html>
